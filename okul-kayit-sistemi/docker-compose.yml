services:
  okul:
    build: .
    container_name: okul-kayit-sistemi
    restart: unless-stopped
    ports:
      # OKUL_BIND=127.0.0.1 (varsayılan) yalnız sunucu içinden erişim -> ters vekil önerilir.
      # Doğrudan dışarıdan test için OKUL_BIND=0.0.0.0 verin.
      - "${OKUL_BIND:-127.0.0.1}:${PORT:-8090}:3000"
    environment:
      NODE_ENV: production
      # Zorunlu: rastgele bir değerle doldurun (deploy.sh otomatik üretir)
      OKUL_JWT_SECRET: ${OKUL_JWT_SECRET:?OKUL_JWT_SECRET tanımlanmalı}
      # İsteğe bağlı: kampüsleri özelleştirin -> "KOD:Ad,KOD2:Ad 2"
      OKUL_KAMPUSLER: ${OKUL_KAMPUSLER:-}
    volumes:
      - okul-data:/data

volumes:
  okul-data:
