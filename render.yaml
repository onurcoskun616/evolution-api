# Render Blueprint - Okul Kayıt Sistemi
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: okul-kayit-sistemi
    runtime: docker
    rootDir: okul-kayit-sistemi
    dockerfilePath: ./Dockerfile
    plan: starter          # kalıcı disk için en az "starter" gerekir (free planda disk yok)
    region: frankfurt      # Türkiye'ye en yakın bölge
    branch: claude/school-enrollment-system-07tbms
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OKUL_JWT_SECRET
        generateValue: true   # Render güvenli rastgele değer üretir
    disk:
      name: okul-data
      mountPath: /data
      sizeGB: 1
